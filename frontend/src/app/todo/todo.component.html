<mat-toolbar class="toolbar">
    <span>Todo List App</span>
</mat-toolbar>

<div class="add-task-container">
  <button mat-raised-button color="primary" (click)="openDialog()">Add New Task +</button>
</div>

<div class="table-container">
  <table mat-table [dataSource]="todos" class="mat-elevation-z8">

    <ng-container matColumnDef="task">
      <th mat-header-cell *matHeaderCellDef> Task </th>
      <td mat-cell *matCellDef="let todo"> {{todo.title}} </td>
    </ng-container>

     <ng-container matColumnDef="completed">
      <th mat-header-cell *matHeaderCellDef> Completed </th>
      <td mat-cell *matCellDef="let todo"> 
         <mat-checkbox [checked]="todo.completed" disabled></mat-checkbox>
      </td>
    </ng-container>

      <ng-container class="mat-column-action" matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef> Action </th>
      <td mat-cell *matCellDef="let todo">
        <button mat-icon-button color="primary" (click)="updateTodo(todo.id,todo)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteTodo(todo.id)">
          <mat-icon>delete</mat-icon>
        </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
    <tr mat-row *matRowDef="let myRowData; columns: columnsToDisplay"></tr>
  </table>
</div>
