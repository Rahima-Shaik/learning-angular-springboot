<div class="dialog-container mat-elevation-z8">
  <div class="dialog-header">
    <h3>Add new Task</h3>
    <button mat-icon-button class="close-btn" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-form-field appearance="outline" style="width: 100%;">
    <mat-label>Add New Todo</mat-label>
    <input matInput [(ngModel)]="taskTitle" />
  </mat-form-field>

  <div class="checkbox-row">
  <mat-checkbox [(ngModel)]="completed">Mark as Completed</mat-checkbox>
  </div>

  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!taskTitle">
    Submit
  </button>
</div>
